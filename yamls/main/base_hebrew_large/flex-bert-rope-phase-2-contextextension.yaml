# HebrewModernBERT-LARGE phase-2: derived from yamls/main/base_hebrew/flex-bert-rope-phase-2-contextextension.yaml
# (the validated base recipe), NOT from the stale yamls/main/large/ tree. Deriving from the base
# file is what carries the full docs/TRAINING.md §5 context-extension fix stack verbatim:
# sequence_packing:true on BOTH loaders, loss_kwargs.inplace_backward:true, streaming:false,
# load_weights_only:true, spin_dataloaders:false, local_attn_rotary_emb_base.
# Deltas vs base: architecture 28L/1024/16heads/2624, run_group large, chained load_path,
# and a smaller microbatch (large is ~2.2x the params; the 150K-vocab logits dominate at 8192).
# HebrewModernBERT phase-2: quality-heavy ANNEAL at 8192 (LR 3e-4 -> ~0).
# Trains on the curated-heavy anneal corpus (books/news/wiki ~40%) with sequence_packing:true
# (same per-doc cu_seqlens isolation as phase-1). The anneal HELPED retrieval in the diagnosis
# (0.142 -> 0.147), so we keep it; it's the recency lock-in on the highest-quality Hebrew.
# NOTE at launch: clear stale checkpoints under this run_name before the first start.
run_group: large
data_local: ./data/hebrewmodernbert/hebrew_quality_anneal # curated-heavy anneal corpus (per-document)
data_remote:

max_seq_len: 8192
tokenizer_name: tokenizer/v4_bpe_150k
mlm_probability: 0.2  # Stage 1 A/B winner (2026-07-30): 20% beat 30% by +0.036 avg NDCG@10 (+39% relative), matched checkpoint, see docs/RETRIEVAL_EVAL.md
count_padding_tokens: false

run_name: modern-bert-large-phase-2-contextextension

model:
  name: flex_bert
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  disable_train_metrics: true
  model_config:
    num_attention_heads: 16
    num_hidden_layers: 28
    hidden_size: 1024
    intermediate_size: 2624
    layer_norm_eps: 1e-5
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: prenorm
    embed_dropout_prob: 0.0
    embed_norm: true
    final_norm: true
    embedding_layer: sans_pos
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
      inplace_backward: true
      # NOTE (verified 2026-08-11): this is a NO-OP. FlexBertConfig.__init__
      # (src/bert_layers/configuration_bert.py:227-229) unconditionally resets
      # inplace_backward to False with a warning, and nothing re-enables it. Kept only for
      # parity with the base run, which produced its numbers under the same no-op. What
      # ACTUALLY carries the 150K-vocab backward at 8192 is the small microbatch +
      # masked_prediction:true + PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True.
      # If large OOMs at 8192, making that guard conditional on disable_train_metrics:true
      # (which phases 1/2 already set, so "incorrect metrics" would be moot) is an
      # available memory lever -- but it is a behaviour change, so measure first.
    max_position_embeddings: ${max_seq_len}
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    normalization: layernorm
    norm_kwargs:
      eps: 1e-5
      bias: false
    padding: unpadded
    sparse_prediction: false
    rotary_emb_dim: null
    rotary_emb_base_local: 10000.0
    rotary_emb_base: 160000.0
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    local_attn_rotary_emb_base: 10000.0
    local_attn_rotary_emb_dim: null
    allow_embedding_resizing: true
    hidden_act: gelu
    head_pred_act: gelu
    activation_function: gelu
    init_method: full_megatron
    init_std: 0.02
    init_cutoff_factor: 2.0
    init_small_embedding: False
    deterministic_fa2: false
    initial_attention_layer: null
    initial_bert_layer: null
    initial_mlp_layer: null
    num_initial_layers: 0
    skip_first_prenorm: true
    sliding_window: 128
    global_attn_every_n_layers: 3
    unpad_embeddings: true
    pad_logits: false
    compile_model: true
    masked_prediction: true
    vocab_size: 150016
    type_vocab_size: 1
    bos_token_id: 2
    cls_token_id: 2
    eos_token_id: 3
    pad_token_id: 0
    sep_token_id: 3

# Dataloaders
train_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: train
    streaming: false
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: true
    mlm_probability: ${mlm_probability}
    shuffle_seed: 71 # 17 reversed -- same corpus, different presentation; see note below
  drop_last: true
  num_workers: 4
  sequence_packing: true # per-doc packing (no cross-doc attention)

eval_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: validation
    streaming: false
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: false
    mlm_probability: 0.15
  drop_last: false
  num_workers: 4
  sequence_packing: true

# Optimization — 1-sqrt anneal to ~0 (the final polish on the quality corpus)
scheduler:
  name: one_minus_sqrt
  alpha_f: 0.001
  t_decay: ${max_duration}
  t_max: ${max_duration}

optimizer:
  name: decoupled_stableadamw
  lr: 3e-4 # Peak LR (annealed to ~0)
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-5
  filter_bias_norm_wd: true
  log_grad_norm: true

# 15B — SMALLER than the 40B ctx-ext (corrects the old inverted 30B:50B). The anneal corpus is
# only ~15B (curated at its ~5-epoch cap), so this is ~1 epoch over it: max quality, no overfit.
max_duration: 15_000_000_000tok
eval_interval: 1000ba
eval_subset_num_batches: 50

# System
  # DECORRELATE from the base run's data presentation. Large is tile-initialized from a base that
  # already consumed this exact corpus with the default shuffle_seed, so replaying the identical
  # document order (and, in the packed phases, the identical packing + mask positions) would be the
  # most redundant possible second pass. Set on the TRAIN loader only: the eval loader keeps the
  # defaults and `seed` stays 17, so the eval curve remains directly comparable to base's.
  # Knobs (src/text_data.py): shuffle_seed drives DistributedSamplerPCG64DXSM (order, default 9176)
  # and GreedyBestFitSequencePacker (packing + masking, default 42). `seed` drives torch RNG, which
  # is what masks the non-packed phase-0 batches via DataCollatorForLanguageModeling.
seed: 17 # unchanged: keeps eval masking identical to the base run
global_train_batch_size: 576
device_train_microbatch_size: 4 # SAFETY-FIRST for an unattended chain (2026-08-25). Base validated
                                # mb=16 at 22L/768 at 8192; large's activation cost scales ~1.70x
                                # ((28/22)x(1024/768)), so the equivalent is ~9.4 -- mb=8 leaves only
                                # 1.18x headroom, mb=4 leaves 2.36x. Since phases 1/2 run chained via
                                # slurm dependencies with nobody watching, an OOM would break the chain
                                # and cost days of queue time; the cost of mb=4 is only extra
                                # gradient-accumulation steps. Both are far below the flash-attn rotary
                                # int32 ceiling (~72 for 16 heads). Raise to 8-12 only after the
                                # phase-1 smoke validates it.
precision: amp_bf16

global_eval_batch_size: 64
device_eval_microbatch_size: 2

# Logging
progress_bar: true
log_to_console: false
console_log_interval: 10ba

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

callbacks:
  speed_monitor:
    window_size: 50
  lr_monitor: {}

loggers:
  wandb:
    project: HebModernBERT-large-phase2
    entity: asafam
    init_kwargs:
      resume: allow
      allow_val_change: true
      # `id` is set by the launch script as ${RUN_NAME}-g${NGPUS}. This supersedes the base
      # phase-1/2 approach of "no stable id, fresh run per launch": suffixing the id with the GPU
      # count keeps one continuous curve per GPU count while still sidestepping the ConfigError
      # (composer's WandBLogger.log_hyperparameters() calls wandb.config.update() with no
      # allow_val_change, so a stable id whose locked num_gpus_per_node changes hard-crashes).
      # Checkpoint resume is keyed on run_name, not the W&B id, so this costs no progress.

checkpoint_dir: "checkpoints"
save_interval: 100ba
save_num_checkpoints_to_keep: 10
save_folder: ${checkpoint_dir}/${run_group}/${run_name}/ckpt

load_path: ${checkpoint_dir}/${run_group}/modern-bert-large-phase-1-contextextension/ckpt/latest-rank0.pt
load_weights_only: true # load phase-1 WEIGHTS only -> fresh optimizer/schedule/clock

spin_dataloaders: false
autoresume: true
