# HebrewModernBERT-LARGE — phase-0 pretrain (1024 ctx), WARM-STARTED from the trained base.
#
# Derived from yamls/main/base_hebrew/flex-bert-rope-phase-0-pretrain.yaml (the validated base
# recipe), NOT from the stale yamls/main/large/ tree (a Jun-18 draft predating the overhaul:
# mixed En/code data, mlm 0.3, no sequence_packing, no inplace_backward, microbatch placeholders).
#
# Deltas vs base phase-0:
#   - architecture 28L / 1024 hidden / 16 heads / 2624 intermediate (base: 22 / 768 / 12 / 1152)
#   - lr 5.0e-4 (base 8.0e-4) — ModernBERT-large's published LR, and right for a warm start
#   - mlm_probability 0.2 written HERE (base's file still says 0.3; its winning 20% arm existed
#     only as a MLM_PROB=0.2 CLI override — do not inherit that landmine)
#   - init_from_checkpoint: Phi-style weight tiling from the base phase-0 endpoint
#   - save_num_checkpoints_to_keep: 20 (not -1) — a large ckpt is ~6GB; -1 cost base 304GB/phase
run_group: large # checkpoint namespace shared across phases (checkpoints/large/)
data_local: ./data/hebrewmodernbert/hebrew_quality # quality-re-weighted Hebrew corpus (~131.1B tok)
data_remote:

max_seq_len: 1024
tokenizer_name: tokenizer/v4_bpe_150k # BPE 150K, 1.302 tok/word, 0% UNK
mlm_probability: 0.2 # Stage 1 A/B winner (2026-07-30): 20% beat 30% by +0.036 avg NDCG@10 (+39% rel), see docs/RETRIEVAL_EVAL.md
count_padding_tokens: false # count only REAL tokens toward max_duration

# Run Name
run_name: modern-bert-large-phase-0-pretrain

# Model
model:
  name: flex_bert
  recompute_metric_loss: false
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  model_config:
    # --- LARGE architecture (the only structural delta vs base) ---
    # NOTE: FlexBertConfig raises unless (num_hidden_layers - 1) % global_attn_every_n_layers == 0.
    # With global_attn_every_n_layers: 3 the legal counts are 4, 7, ... 25, 28, 31. 27 % 3 == 0 OK.
    num_attention_heads: 16
    num_hidden_layers: 28
    hidden_size: 1024
    intermediate_size: 2624
    # --- everything below is identical to base_hebrew phase-0 ---
    layer_norm_eps: 1e-5
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: prenorm
    embed_dropout_prob: 0.0
    embed_norm: true
    final_norm: true
    embedding_layer: sans_pos
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
    max_position_embeddings: ${max_seq_len}
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    normalization: layernorm
    norm_kwargs:
      eps: 1e-5
      bias: false
    padding: unpadded
    sparse_prediction: false
    rotary_emb_dim: null
    rotary_emb_base_local: 10000.0
    rotary_emb_base: 160000.0
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    allow_embedding_resizing: true
    hidden_act: gelu
    head_pred_act: gelu
    activation_function: gelu
    init_method: full_megatron
    init_std: 0.02
    init_cutoff_factor: 2.0
    init_small_embedding: False
    deterministic_fa2: false
    initial_attention_layer: null
    initial_bert_layer: null
    initial_mlp_layer: null
    num_initial_layers: 0
    skip_first_prenorm: true
    sliding_window: 128
    global_attn_every_n_layers: 3
    unpad_embeddings: true
    pad_logits: false
    compile_model: true
    masked_prediction: true
    vocab_size: 150016
    type_vocab_size: 1
    bos_token_id: 2
    cls_token_id: 2
    eos_token_id: 3
    pad_token_id: 0
    sep_token_id: 3

# The BASE model's config -- used ONLY to reconstruct the pretrained model for weight tiling.
# It must be a FULL model block (init_from_checkpoint reads .pretrained_model_name at main.py:398),
# not just a model_config. Every commented-out example in this repo writes `checkpoint_cfg: ${model}`,
# which resolves to the ENCLOSING file's own model block -- in a large yaml that would build a LARGE
# model and then load a BASE state dict into it, and fail. Hence this separate literal block.
# `bert_layer`, `padding`, `embedding_layer` and `compile_model` MUST match the large block above:
# init_model_from_pretrained asserts the layer/embedding classes are the same type.
base_model:
  name: flex_bert
  recompute_metric_loss: false
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  # CLASS-SELECTING FIELDS ARE INTERPOLATED FROM THE LARGE BLOCK ABOVE -- do not hardcode them.
  # init_model_from_pretrained asserts the pretrained and new models use the same embedding/encoder/
  # layer CLASSES, and bert_layer + padding + embedding_layer + compile_model are what pick those
  # classes. Restating them here silently breaks the moment anything overrides one on the CLI: the
  # smoke passes model.model_config.compile_model=false for its microbatch auto-search, which gave
  # the large model FlexBertSansPositionEmbeddings while this block stayed compiled -> assert fail.
  model_config:
    num_attention_heads: 12
    num_hidden_layers: 22
    hidden_size: 768
    intermediate_size: 1152
    layer_norm_eps: 1e-5
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: ${model.model_config.bert_layer}
    embed_dropout_prob: 0.0
    embed_norm: true
    final_norm: true
    embedding_layer: ${model.model_config.embedding_layer}
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
    max_position_embeddings: ${max_seq_len}
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    normalization: layernorm
    norm_kwargs:
      eps: 1e-5
      bias: false
    padding: ${model.model_config.padding}
    sparse_prediction: false
    rotary_emb_dim: null
    rotary_emb_base_local: 10000.0
    rotary_emb_base: 160000.0
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    allow_embedding_resizing: true
    hidden_act: gelu
    head_pred_act: gelu
    activation_function: gelu
    init_method: full_megatron
    init_std: 0.02
    init_cutoff_factor: 2.0
    init_small_embedding: False
    deterministic_fa2: false
    initial_attention_layer: null
    initial_bert_layer: null
    initial_mlp_layer: null
    num_initial_layers: 0
    skip_first_prenorm: true
    sliding_window: 128
    global_attn_every_n_layers: 3
    unpad_embeddings: true
    pad_logits: false
    compile_model: ${model.model_config.compile_model}
    masked_prediction: true
    vocab_size: 150016
    type_vocab_size: 1
    bos_token_id: 2
    cls_token_id: 2
    eos_token_id: 3
    pad_token_id: 0
    sep_token_id: 3

# Dataloaders
train_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: train
    streaming: false
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: true
    mlm_probability: ${mlm_probability}
    shuffle_seed: 71 # 17 reversed -- same corpus, different presentation; see note below
  drop_last: true
  # RAISED 8 -> 24 (2026-08-11), from the live run's own counters: the job uses only ~7 of its 32
  # allocated CPUs while sustaining just ~170K tok/s, i.e. workers are BLOCKED ON I/O, not computing.
  # More workers => more concurrent outstanding NFS reads, and there are ~25 idle cores to absorb them.
  # Quality-neutral: DataLoader hands whole batches to workers round-robin and order is fixed by the
  # sampler + shuffle_seed, so batch composition is unchanged (confirmed empirically: nw=8 vs nw=16
  # gave loss 3.0166 vs 3.0245, i.e. DDP nondeterminism, not a different data stream).
  # Takes effect automatically at the next 4h-wall requeue -- no cancel needed.
  num_workers: 24
  prefetch_factor: 4 # deeper runway (default 2)
  # NOTE (verified 2026-08-11): both keys below are a NO-OP in phase-0. src/text_data.py reads them
  # only inside `if not streaming and sequence_packing:` (the GreedyBestFitSequencePacker branch),
  # and phase-0 does not set sequence_packing -- so no batch-size ramp has ever run here, in base or
  # large. Kept for parity with the base run, which produced its numbers under the same no-op.
  # (It is also why device_train_microbatch_size=auto leaking through this interpolation during the
  # smoke probe is harmless: nothing consumes the resulting "auto" string.)
  # The ramp IS live in phase-1/2, which do set sequence_packing.
  batch_size_warmup_min_size: ${device_train_microbatch_size}
  batch_size_warmup_tokens: 50_000_000_000tok

eval_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: validation
    streaming: false
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: false
    mlm_probability: 0.15 # We always evaluate at 15% masking for consistent comparison
  drop_last: false
  num_workers: 8

# Optimization
scheduler:
  name: constant_with_warmup # stable pretrain; NO anneal here (the anneal is phase-2)
  t_warmup: 0.06dur
  t_max: ${max_duration}

optimizer:
  name: decoupled_stableadamw
  lr: 5.0e-4 # ModernBERT-large's published peak LR (base uses 8.0e-4); also right for a tiled warm start
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-5
  filter_bias_norm_wd: true
  log_grad_norm: true

# ~1 epoch over the quality corpus (131.1B tokens as built: hec4_clean 34.50B + fineweb2_hebrew
# 30.00B + yifat_long 28.40B + yifat_fragments 19.30B + oscar 4.90B + hebnli 6.60B + tzenzura 3.30B
# + books 2.15B + wikipedia 1.10B + news 0.85B). Curated sources are already upsampled ~5x in the
# BUILD, so 1 train epoch = ~5 curated epochs = the overfitting cap. Do NOT raise.
max_duration: 130_000_000_000tok
eval_interval: 10000ba
eval_subset_num_batches: 100 # NEVER change this mid-phase: it makes logged eval points non-comparable (docs/TRAINING.md §7)

# System
  # DECORRELATE from the base run's data presentation. Large is tile-initialized from a base that
  # already consumed this exact corpus with the default shuffle_seed, so replaying the identical
  # document order (and, in the packed phases, the identical packing + mask positions) would be the
  # most redundant possible second pass. Set on the TRAIN loader only: the eval loader keeps the
  # defaults and `seed` stays 17, so the eval curve remains directly comparable to base's.
  # Knobs (src/text_data.py): shuffle_seed drives DistributedSamplerPCG64DXSM (order, default 9176)
  # and GreedyBestFitSequencePacker (packing + masking, default 42). `seed` drives torch RNG, which
  # is what masks the non-packed phase-0 batches via DataCollatorForLanguageModeling.
seed: 17 # unchanged: keeps eval masking identical to the base run
global_train_batch_size: 4608 # same as base -> directly comparable curves
device_train_microbatch_size: 576 # MEASURED 2026-08-11 (job 21316657, 1x B200, compile=false):
                                  # Composer's auto-search went 4608->2304->1152->576 and fit at 576.
                                  # 576 is also the right value on arithmetic grounds for the 4-GPU run:
                                  # global 4608 / 4 GPUs = 1152 per device, so 576 = exactly 2 grad-accum
                                  # steps; the only larger divisor is 1152, which the search proved OOMs.
                                  # (On the 1-GPU fallback the device batch is 4608 -> 8 accum steps.)
                                  # Found with compile=false; re-validate once with COMPILE=true,MB=576.
precision: amp_bf16

global_eval_batch_size: 1024
device_eval_microbatch_size: 64 # halved vs base's 128 (larger hidden + 150K-vocab logits)

# Logging
progress_bar: true
log_to_console: false
console_log_interval: 10ba

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

callbacks:
  speed_monitor:
    window_size: 50
  lr_monitor: {}

loggers:
  wandb:
    project: HebModernBERT-large-phase0
    entity: asafam
    init_kwargs:
      resume: allow
      allow_val_change: true
      # `id` is set by the launch script as ${RUN_NAME}-g${NGPUS}: composer's
      # WandBLogger.log_hyperparameters() calls wandb.config.update() with no allow_val_change, so a
      # stable id whose locked num_gpus_per_node differs from a resumed run's GPU count hard-crashes.

checkpoint_dir: "checkpoints"
save_interval: 2000ba
save_num_checkpoints_to_keep: 20 # NOT -1: a large ckpt is ~6GB; base's phase-0 hit 304GB at -1
save_folder: ${checkpoint_dir}/${run_group}/${run_name}/ckpt

# Warm start: Phi-style weight tiling from the trained BASE phase-0 endpoint.
# Source is deliberately phase-0 (stable-LR endpoint, 130B tok, 20% masking) and NOT the phase-2
# final: that one is annealed to LR~0 and its query/document alignment flipped negative
# (+0.914 -> -0.269, docs/RETRIEVAL_EVAL.md), a poor starting point for further pretraining.
# The path resolves to <checkpoint_load_path>/<checkpoint_run_name>/latest-rank0.pt (hardcoded in
# main.py:385). Requires the tile_embedding fix at src/bert_layers/model.py (else the 150016x1024
# token embedding matrix -- 31% of the model -- silently stays at random init).
init_from_checkpoint:
  checkpoint_cfg: ${base_model}
  checkpoint_load_path: ${checkpoint_dir}
  checkpoint_run_name: base/phase-0-arm1-m20/ckpt
  mode: tile_weights_from_middle

# phase-0 has no load_path: the warm start comes from init_from_checkpoint above.
# NOTE: init_from_checkpoint re-runs on every autoresume restart, before Composer overwrites the
# weights from the resumed checkpoint. Harmless, costs ~1-2 min per requeue.
spin_dataloaders: false # skip dataloader fast-forward on resume (NoStreamingDataset would re-iterate 200M+ docs -> hang)
autoresume: true # on requeue, resume from latest checkpoint in save_folder
