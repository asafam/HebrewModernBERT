# HebrewModernBERT — UNIFIED phase-0 pretrain (replaces the old phase-0.1 mixed + phase-0.2 Hebrew).
# Single Hebrew-only pretrain on the quality-re-weighted corpus (no English/code dilution).
# Stable schedule (constant LR, NO anneal) — matches ModernBERT's structure: pretrain -> ctx-ext
# (phase-1) -> anneal (phase-2). The final anneal now lives in phase-2 on the quality-heavy corpus.
run_group: base # checkpoint namespace shared across phases (checkpoints/base/)
data_local: ./data/hebrewmodernbert/hebrew_quality # quality-re-weighted Hebrew corpus (build: config/data/train/datasets_hebrew_quality + FineWeb-2)
data_remote:

max_seq_len: 1024
tokenizer_name: tokenizer/v4_bpe_150k # BPE 150K, 1.302 tok/word, 0% UNK
mlm_probability: 0.3 # 30% masking
count_padding_tokens: false # count only REAL tokens toward max_duration

# Run Name
run_name: modern-bert-base-phase-0-pretrain

# Model
model:
  name: flex_bert
  recompute_metric_loss: false
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  model_config:
    num_attention_heads: 12
    num_hidden_layers: 22
    hidden_size: 768
    intermediate_size: 1152
    layer_norm_eps: 1e-5
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: prenorm
    embed_dropout_prob: 0.0
    embed_norm: true
    final_norm: true
    embedding_layer: sans_pos
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
    max_position_embeddings: ${max_seq_len}
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    normalization: layernorm
    norm_kwargs:
      eps: 1e-5
      bias: false
    padding: unpadded
    sparse_prediction: false
    rotary_emb_dim: null
    rotary_emb_base_local: 10000.0
    rotary_emb_base: 160000.0
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    allow_embedding_resizing: true
    hidden_act: gelu
    head_pred_act: gelu
    activation_function: gelu
    init_method: full_megatron
    init_std: 0.02
    init_cutoff_factor: 2.0
    init_small_embedding: False
    deterministic_fa2: false
    initial_attention_layer: null
    initial_bert_layer: null
    initial_mlp_layer: null
    num_initial_layers: 0
    skip_first_prenorm: true
    sliding_window: 128
    global_attn_every_n_layers: 3
    unpad_embeddings: true
    pad_logits: false
    compile_model: true
    masked_prediction: true
    vocab_size: 150016
    type_vocab_size: 1
    bos_token_id: 2
    cls_token_id: 2
    eos_token_id: 3
    pad_token_id: 0
    sep_token_id: 3

# Dataloaders
train_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: train
    streaming: false
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: true
    mlm_probability: ${mlm_probability}
  drop_last: true
  num_workers: 8
  batch_size_warmup_min_size: ${device_train_microbatch_size}
  batch_size_warmup_tokens: 50_000_000_000tok

eval_loader:
  name: text
  dataset:
    local: ${data_local}
    remote: ${data_remote}
    split: validation
    streaming: false
    tokenizer_name: ${tokenizer_name}
    max_seq_len: ${max_seq_len}
    shuffle: false
    mlm_probability: 0.15
  drop_last: false
  num_workers: 8

# Optimization
scheduler:
  name: constant_with_warmup # stable pretrain; NO anneal here (the anneal is phase-2 on the quality corpus)
  t_warmup: 0.06dur
  t_max: ${max_duration}

optimizer:
  name: decoupled_stableadamw
  lr: 8.0e-4 # Peak LR (matches ModernBERT)
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-5
  filter_bias_norm_wd: true
  log_grad_norm: true

# ~1 epoch over the quality corpus (curated sources are upsampled ~5x in the BUILD, so
# 1 train epoch = ~5 curated epochs = the overfitting cap). Do NOT raise to multiple epochs
# or curated over-repeats. Tune together with the build size.
# CORRECTED 2026-07-22: the actual built corpus (data/hebrewmodernbert/hebrew_quality,
# now including FineWeb-2) sums its sources' own tokens_target exactly as built:
# hec4_clean 34.50B + fineweb2_hebrew 30.00B + yifat_long 28.40B + yifat_fragments 19.30B
# + oscar 4.90B + hebnli 6.60B + tzenzura 3.30B + books 2.15B + wikipedia 1.10B + news 0.85B
# = 131.1B tokens (confirmed via the build job's per-source yield log). The mix config's
# own header comment's "~161B" figure never matched this sum (a pre-existing, ~30B
# discrepancy in its rough percentage breakdown) -- 130B keeps max_duration safely at
# ~1 epoch without overshooting into a second, partial loop over the corpus.
max_duration: 130_000_000_000tok
eval_interval: 10000ba
eval_subset_num_batches: 100

# System
seed: 17
global_train_batch_size: 4608
device_train_microbatch_size: 576 # B200-validated 2026-07-22 (auto-search + compile=true de-risk,
                                   # no OOM, job 18317048): ~317.6K tok/s/device with compile=true.
                                   # Was 288 (H200-tuned, never re-validated on B200). For the
                                   # LARGE model this must be re-tuned downward.
precision: amp_bf16

global_eval_batch_size: 1024
device_eval_microbatch_size: 128

# Logging
progress_bar: true
log_to_console: false
console_log_interval: 10ba

algorithms:
  gradient_clipping:
    clipping_type: norm
    clipping_threshold: 1.0

callbacks:
  speed_monitor:
    window_size: 50
  lr_monitor: {}

loggers:
  wandb:
    project: HebModernBERT-phase0
    entity: asafam
    init_kwargs:
      resume: allow
      allow_val_change: true # let num_gpus_per_node change across GPU-count scale-ups/requeues (else wandb ConfigError)
      id: hebrewmodernbert-base-phase-0  # stable across requeues -> one continuous W&B curve

checkpoint_dir: "checkpoints"
save_interval: 4000ba
save_num_checkpoints_to_keep: -1
save_folder: ${checkpoint_dir}/${run_group}/${run_name}/ckpt

# phase-0 trains from scratch — no load_path.
spin_dataloaders: false
autoresume: true
